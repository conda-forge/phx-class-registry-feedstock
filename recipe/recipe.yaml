schema_version: 1

context:
  python_min: "3.12.0"
  name: phx-class-registry
  version: "6.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 7253cc4598bb84dbd83bb83e75b6cb121bfdfba8aaa899f9d975ebefeedd35c2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - typing-extensions >=4.12,<5

tests:
  - python:
      imports:
        - class_registry
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Factory+Registry pattern for Python classes
  license: MIT
  license_file: LICENCE.txt
  homepage: https://github.com/todofixthis/class-registry

extra:
  recipe-maintainers:
    - freundTech
